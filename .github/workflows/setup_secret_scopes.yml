name: setup-secret-scopes

on:
  workflow_dispatch:
    inputs:
      rotate:
        description: "Replace keys that already exist (only when rotating)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scopes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7          # only config/jobs.yml is read (which roles each env mails)

      - name: Install Databricks SDK
        run: pip install --quiet databricks-sdk pyyaml

      - name: Create scopes, write keys, set READ access
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          GROUP_MATCH_KEY: ${{ secrets.GROUP_MATCH_KEY }}
          ROTATE: ${{ inputs.rotate }}
          MAIL_DEVELOPER: ${{ secrets.MAIL_DEVELOPER }}
          MAIL_TEAMLEAD: ${{ secrets.MAIL_TEAMLEAD }}
          MAIL_MANAGER: ${{ secrets.MAIL_MANAGER }}
          MAIL_BIZMANAGER: ${{ secrets.MAIL_BIZ_MANAGER }}
          MAIL_MANAGEMENT: ${{ secrets.MAIL_MANAGEMENT }}
        run: |
          python - <<'EOF'
          import os, secrets, yaml
          from databricks.sdk import WorkspaceClient
          from databricks.sdk.service.workspace import AclPermission

          w = WorkspaceClient(host=os.environ["DATABRICKS_HOST"],
                              token=os.environ["DATABRICKS_TOKEN"])
          rotate   = os.environ.get("ROTATE") == "true"
          prod_key = os.environ.get("GROUP_MATCH_KEY", "")
          if len(prod_key) < 32:
              raise SystemExit("GROUP_MATCH_KEY secret is missing or too short")

          # service principal name -> application id (never printed)
          sp_id   = {s.display_name: s.application_id for s in w.service_principals.list()}
          id_name = {v: k for k, v in sp_id.items()}

          readers = {
              "lh_dev":  ["lh_developer", "lh_teamlead", "lh_manager"],
              # + lh_deploy (CI deploy account): reads the mail keys when it redeploys the test/prod jobs. It can already
              # act as the job accounts ("Use"), so reading their scope gives it no new power.
              "lh_test": [sp_id["sp_bhg_test"], sp_id["sp_fqf_test"], "lh_deploy"],
              "lh_prod": [sp_id["sp_bhg_prod"], sp_id["sp_fqf_prod"], "lh_deploy"],
          }

          # 5.10: failure-mail addresses per scope, only the roles that env's jobs mail (config/jobs.yml):
          # dev = every role that may own a dev job (each person's job mails only them), test/prod = notify.<env>
          jcfg = yaml.safe_load(open("config/jobs.yml"))
          mail_roles = {"lh_dev": set(jcfg["dev_roles"].values()), "lh_test": set(jcfg["notify"]["test"]),
                        "lh_prod": set(jcfg["notify"]["prod"])}

          existing = {s.name for s in w.secrets.list_scopes()}
          for scope, who in readers.items():
              if scope not in existing:
                  w.secrets.create_scope(scope=scope)
                  print(f"{scope}: scope created")
              else:
                  print(f"{scope}: scope already there")

              keys = {k.key for k in w.secrets.list_secrets(scope=scope)}
              if "group_match_key" not in keys or rotate:
                  value = prod_key if scope == "lh_prod" else secrets.token_hex(32)
                  w.secrets.put_secret(scope=scope, key="group_match_key", string_value=value)
                  print(f"{scope}: group_match_key written")
              else:
                  print(f"{scope}: group_match_key kept (rotate=false)")

              for role in sorted(mail_roles[scope]):
                  value = os.environ.get(f"MAIL_{role.upper()}", "")
                  if value.count("@") != 1:
                      raise SystemExit(f"MAIL secret for {role} is missing or not an address")
                  w.secrets.put_secret(scope=scope, key=f"mail_{role}", string_value=value)
              for k in keys:
                  if k.startswith("mail_") and k[5:] not in mail_roles[scope]:
                      w.secrets.delete_secret(scope=scope, key=k)
                      print(f"{scope}: {k} removed (not needed here)")
              print(f"{scope}: mail keys written for {', '.join(sorted(mail_roles[scope]))}")

              for p in who:
                  w.secrets.put_acl(scope=scope, principal=p, permission=AclPermission.READ)

              for a in w.secrets.list_acls(scope=scope):
                  name = "admin (you)" if "@" in a.principal else id_name.get(a.principal, a.principal)
                  print(f"{scope}: {name} -> {a.permission.value}")
          print("DONE")
          EOF
